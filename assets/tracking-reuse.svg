<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="850" viewBox="0 0 1520 850" role="img" aria-labelledby="title desc">
<title id="title">Prepare each frame once</title>
<desc id="desc">Nine tracks on the same two frames share the extracted features.</desc>
<rect width="100%" height="100%" fill="#F5F3EC"/>
<rect x="48" y="200" width="1424" height="220" rx="6" fill="#303D2C"/>
<text x="48" y="32" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="22" font-weight="400" fill="#626959">03 / TRACKING</text>
<text x="48" y="78" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="64" font-weight="400" fill="#303D2C">Prepare each frame once</text>
<rect x="48" y="480" width="398" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="247.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Frame pair</text>
<text x="247.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Decode both images</text>
<rect x="561" y="480" width="398" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="760.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Prepare features</text>
<text x="760.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Cache on each frame</text>
<rect x="1074" y="480" width="398" height="168" rx="6" fill="#F5F3EC" stroke="#D8DBCF" stroke-width="3"/>
<text x="1273.0" y="529.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#303D2C">Track nine points</text>
<text x="1273.0" y="569.0" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#626959">Reuse both feature sets</text>
<polyline points="446,564.0 561,564.0" fill="none" stroke="#284944" stroke-width="3"/>
<polygon points="561,564.0 547.143593539449,572.0 547.143593539449,556.0" fill="#284944"/>
<polyline points="959,564.0 1074,564.0" fill="none" stroke="#284944" stroke-width="3"/>
<polygon points="1074,564.0 1060.143593539449,572.0 1060.143593539449,556.0" fill="#284944"/>
<text x="760.0" y="800" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="28" font-weight="400" fill="#626959">Same JPEG pair and nine points per batch · median CPU time · coordinates checked</text>
<text x="100" y="222" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="108" font-weight="400" fill="#F5F3EC">350 → 74 ms</text>
<text x="108" y="356" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#F5F3EC">Nine-point tracking</text>
<text x="845" y="247" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia, Times New Roman, DejaVu Serif, serif" font-size="40" font-weight="400" fill="#F5F3EC">Reuse across all nine points</text>
<text x="845" y="313" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="30" font-weight="400" fill="#F5F3EC">Two frames, two feature sets</text>
</svg>
